name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after ~7 days without API activity.
# This workflow runs every Monday and issues a few lightweight read queries
# against the database so Supabase always sees recent activity and never
# pauses the project.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase client
        run: npm install @supabase/supabase-js@^2

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/keep-supabase-alive.mjs
